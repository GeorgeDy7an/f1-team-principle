<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>车队领队 · 策略演示</title>
  <style>
    :root{color-scheme:dark;--ink:#f2f5f8;--muted:#b5c2cf;--line:#536477;--panel:#13263a;--canvas:#071625;--accent:#f2b453;--good:#a3e7ca}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:590px;min-height:100svh;margin:auto;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-weight:800;letter-spacing:.04em}.badge{color:var(--accent);font-size:.78rem;border:1px solid #99773f;border-radius:20px;padding:3px 9px;white-space:nowrap}.languages{display:flex;gap:8px}.languages button{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}.languages button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.languages button:focus-visible{outline:3px solid #fff;outline-offset:2px}h1,h2,p{margin:0}h1{font-size:clamp(1.8rem,7vw,2.65rem);line-height:1.15;letter-spacing:-.03em}h2{font-size:1.18rem}.muted{color:var(--muted)}.story{border-left:3px solid var(--accent);padding-left:16px}.story p{margin-top:9px}.raceboard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:#dce7ed;color:#102438;border-radius:5px}.raceboard strong{font-size:1.45rem}.raceboard span{display:block;font-size:.78rem}.content{display:grid;gap:12px}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:16px;padding:14px 16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit}.choice strong,.choice small{display:block}.choice small{color:var(--muted);margin-top:2px;font-size:.84rem}.choice .mark{color:var(--accent);font-size:1.25rem}.choice:hover,.choice:focus-visible{border-color:var(--accent);outline:2px solid transparent;outline-offset:2px}.choice:focus-visible{outline-color:var(--accent)}.result{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:8px}.result .position{font-size:clamp(2.5rem,10vw,4rem);line-height:1;font-weight:900;color:var(--good)}.primary{padding:12px 18px;border:0;border-radius:6px;background:var(--accent);color:#172334;font:inherit;font-weight:800;cursor:pointer}.primary:focus-visible{outline:3px solid #fff;outline-offset:3px}footer{margin-top:auto;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:12px}footer p+p{margin-top:5px}@media(max-width:360px){main{padding:14px;gap:14px}.choice{padding:11px 12px}.raceboard{padding:12px}.story p{font-size:.9rem}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand" data-text="brand">车队领队</div><span class="badge" data-text="badge">独立简化演示</span></header>
    <div class="languages" role="group" aria-label="语言 / Language"><button type="button" data-language="zh" aria-pressed="true">中文</button><button type="button" data-language="en" aria-pressed="false">English</button></div>
    <section class="story" aria-labelledby="title">
      <h1 id="title" data-text="title">最后一场，你来做决定。</h1>
      <p class="muted" data-text="intro">虚构的星河车队排名第三。前方对手更快，但一次选择可能改变比赛结果。</p>
    </section>
    <div class="raceboard" aria-label="当前形势：车队第三，下一场为赛季收官战"><div><span data-text="ranking">车队排名</span><strong data-text="third">第 3</strong></div><div><span data-text="next">下一站</span><strong data-text="finale">赛季收官战</strong></div></div>
    <section id="game" class="content" aria-live="polite"></section>
    <footer><p data-text="disclaimer">这是为作品集单独制作的小型示例，不包含完整游戏的代码、数据或赛季系统。</p><p data-text="replay">结果会随选择和随机波动变化；可反复体验。</p></footer>
  </main>
  <script>
    'use strict';
    const game = document.getElementById('game');
    const text = {
      zh:{brand:'车队领队',badge:'独立简化演示',title:'最后一场，你来做决定。',intro:'虚构的星河车队排名第三。前方对手更快，但一次选择可能改变比赛结果。',ranking:'车队排名',third:'第 3',next:'下一站',finale:'赛季收官战',board:'当前形势：车队第三，下一场为赛季收官战',disclaimer:'这是为作品集单独制作的小型示例，不包含完整游戏的代码、数据或赛季系统。',replay:'结果会随选择和随机波动变化；可反复体验。',choose:'选择你的比赛策略',push:'全力进攻',pushDetail:'争取更好名次，但也可能掉出前列。',steady:'稳住节奏',steadyDetail:'控制风险，争取可靠完赛。',result:'收官战结果',position:n=>`第 ${n} 名`,outcomes:{1:'你抓住机会登上了最高领奖台。',2:'车队把握住机会，拿到亚军。',3:'车队稳住了领奖台位置。',5:'这次尝试未能奏效，车队最终排名第五。'},selected:s=>`你的选择：${s}。比赛结果还受到随机波动影响。`,retry:'重新选择'},
      en:{brand:'Team Principal',badge:'Standalone demo',title:'The final race. Your call.',intro:'The fictional Galaxy team sits third. Its rivals ahead are faster, but one decision could change the result.',ranking:'Team position',third:'3rd',next:'Next race',finale:'Season finale',board:'Current situation: third in the standings, with the season finale next',disclaimer:'This small portfolio demo was built independently and does not include the full game code, data or season systems.',replay:'Results depend on your choice and random variation. You can play again.',choose:'Choose your race strategy',push:'Push hard',pushDetail:'Aim for a better finish, with a greater risk of falling back.',steady:'Hold steady',steadyDetail:'Control the risk and aim for a reliable finish.',result:'Season finale result',position:n=>`P${n}`,outcomes:{1:'You seized the opportunity and took victory.',2:'The team made the most of the opportunity and finished second.',3:'The team held on to a podium finish.',5:'The plan did not pay off; the team finished fifth.'},selected:s=>`Your choice: ${s}. The result was also affected by random variation.`,retry:'Choose again'}
    };
    const odds={push:[.3,.62,.88,1],steady:[.08,.3,.83,1]};
    let language='zh', lastResult=null;
    function render(){const t=text[language]; document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=language==='zh'?'车队领队 · 策略演示':'Team Principal · Strategy Demo';document.querySelectorAll('[data-text]').forEach(node=>{node.textContent=t[node.dataset.text]});document.querySelector('.raceboard').setAttribute('aria-label',t.board);document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));if(lastResult)showResult();else showChoices()}
    function showChoices(){
      game.className='content';
      const t=text[language]; game.innerHTML=`<h2>${t.choose}</h2>` + ['push','steady'].map(id => `<button class="choice" type="button" data-choice="${id}"><span><strong>${t[id]}</strong><small>${t[id+'Detail']}</small></span><span class="mark" aria-hidden="true">›</span></button>`).join('');
      game.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>runRace(button.dataset.choice)));
    }
    function runRace(id){
      if(!odds[id])return; const roll=Math.random(); const index=odds[id].findIndex(limit=>roll<limit); const places=[1,2,3,5]; lastResult={id,place:places[index<0?3:index]}; showResult();
    }
    function showResult(){
      const t=text[language],{id,place}=lastResult;
      game.className='result';
      game.innerHTML=`<h2>${t.result}</h2><div class="position">${t.position(place)}</div><p>${t.outcomes[place]}</p><p class="muted">${t.selected(t[id])}</p><button class="primary" type="button">${t.retry}</button>`;
      game.querySelector('button').addEventListener('click',()=>{lastResult=null;showChoices()});
    }
    document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{language=button.dataset.language;render()}));
    render();
  </script>
</body>
</html>
